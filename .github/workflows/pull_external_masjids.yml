name: Pull External Masjids

on:
  schedule:
    - cron: "5 8 * * *"   # 12:05 AM PST (UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase Edge Function
        run: |
          curl -X POST \
            "https://kjbutgbpddsadvnbgblg.supabase.co/functions/v1/pull_external_masjids" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
